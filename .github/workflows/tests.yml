name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder:
          - 01-polyglot-scorecard-r-python-c
          - 03-survival-lifetime-pd-term-structure
          - 04-bayesian-hierarchical-partial-pooling
          - 05-monotonic-constraints-conformal-decisioning
          - 06-optimal-binning-scorecard
          - 07-fair-lending-bias-audit
          - 08-differential-privacy-scoring
          - 09-reject-inference-selection-bias
          - 10-through-the-cycle-pd-vasicek
          - 11-federated-credit-scoring
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ${{ matrix.folder }}/requirements.txt

      - name: Install CPU PyTorch when the folder needs it
        run: |
          if grep -qiE '^torch([><=~ ]|$)' requirements.txt; then
            python -m pip install --upgrade pip
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q
